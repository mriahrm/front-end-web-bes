<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Recrutamento Online</title>
        <meta charset= "utf-8"> 
    </head>
    <body>
      <header>
          <h1>Recrutamento Online</h1>
      </header>
      <main>
        <section>
            <h2> Cadastre o seu curriculo</h2>
            <form action="https://postman-echo.com/post" method="post" enctype="multipart/form=data">
                <p>Preencha o formulário abaixo para se cadidatar à vaga</p>
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <div>
                      <label for="foto_id">Foto:</label>
                      <input id="foto_id" name="foto" type="file" accept="image/*">
                    </div>

                    <div>
                      <label for="nome_id">Nome Completo:</label>
                      <input id="nome_id" name="nome" type="text" placeholder="Maria Joaquina">
                    </div>

                    <div>
                      <label for="telefone_id">Telefone:</label>
                      <input id="telefone_id" name="telefone" type="tel" required>
                    </div>

                    <div>
                      <label for="nome_id">Nome Completo:</label>
                      <input id="nome_id" name="nome" type="text">
                    </div>

                    <div>
                      <label for="telefone_id">Telefone:</label>
                      <input id="telefone_id" name="telefone" type="tel">
                    </div>

                    <div>
                      <label for="email_id">Email:</label>
                      <input id="email_id" name="email" type="email">
                    </div>

                    <div>
                      <label for="data_nasc_id">Data de Nascimento:</label>
                      <input id="data_nasc_id" name="data_nas" type="date">
                    </div>

                    <fieldset>
                        <legend>Endereço</legend>

                        <div>
                          <label for="Logradouro_id">Logradouro:</label>
                          <input id="Logradouro_id" name="Logradouro" type="text">
                        </div>

                        <div>
                          <label for="cidade_id">Cidade-UF</label>
                          <input id="cidade_id" name="cidade" type="tel">
                        </div>

                        <div>
                          <label for="numero_id">Número:</label>
                          <input id="numero_id" name="numero" type="number">
                        </div>

                    </fieldset>
                </fieldset>    

                <fieldset>
                    <legend>Resumo</legend>

                    <div>
                        <label>Fale Sobre você</label>
                        <textarea id="resumo_id" name="resumo"></textarea>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Nível desejado</legend>

                    <div>
                        <input id="nivel_estagio_id" name="nivel" type="radio">
                        <label for="nivel_estagio_id"Estágio>Estágio</label>
                    </div>

                    <div>
                        <input id="nivel_junior_id" name="nivel" type="radio" value="junior">
                        <label for="nivel_junior_id">Júnior</label>
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Tecnologias que domina:</legend>

                    <div>
                        <input id="tec_html_id" name="tecnlogias" type="checkbox" value="html">
                        <label for="tec_html_id">HTML</label>
                    </div>

                    <div>
                      <input id="tec_css_id" name="tecnlogias" type="checkbox" value="css">
                      <label for="tec_css_id">CSS</label>
                    </div>

                    <div>
                      <input id="tec_js_id" name="tecnlogias" type="checkbox" value="js">
                      <label for="tec_js_id">JS</label>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Grau de instrução</legend>

                    <div>
                      <label for="escolaridade_id">Escolaridade</label>
                      <select id="escolaridade_id" name="escolaridade">
                        <option value="medio">Ensino Médio</option>
                        <option value="graduacao">Graduação</option>
                        <option value="pos">Pós</option>
                      </select>
                    </div>

                </fieldset>
                <div>
                    <button type="reset">Limpar dados</button>
                    <button type="submit">Enviar candidatura</button>
                </div>

            </form>
        </section>
      </main>
      <footer>
        <p>Todos os direitos reservados &copy;</p>

      </footer>  
    </body>
</html>
